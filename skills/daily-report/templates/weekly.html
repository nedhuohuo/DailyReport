<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{weekly_header}</title>
<!-- WEEKLY_HTML_STYLE_LOCKED: copy this <style> block verbatim. Do not restyle. -->
<style>
:root{--text:#1f2328;--muted:#57606a;--border:#d0d7de;--bg:#fff;--head-bg:#f6f8fa}
*{box-sizing:border-box}body{margin:0;padding:32px 20px 48px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--text);background:#f3f4f6;line-height:1.7}
.page{max-width:860px;margin:0 auto;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:40px 44px}
h1{margin:0 0 28px;font-size:1.55rem;border-bottom:1px solid var(--border);padding-bottom:16px}h2{margin:32px 0 14px;font-size:1.2rem}
p{margin:0 0 12px}.task-title{margin:22px 0 10px;font-weight:600}
.sub-title{margin:16px 0 8px;font-weight:600}
table{width:100%;border-collapse:collapse;margin:0 0 8px;font-size:.95rem}th,td{border:1px solid var(--border);padding:10px 12px;text-align:left;vertical-align:top}th{background:var(--head-bg);font-weight:600}
td.status{white-space:nowrap;width:8.5em}ol{margin:0;padding-left:1.4em}li{margin:6px 0}
.footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--border);color:var(--muted);font-size:.85rem}
@media print{body{background:#fff;padding:0}.page{border:none;border-radius:0;padding:0}}
</style>
</head>
<body>
<article class="page">
<h1>{weekly_header}</h1>
<h2>一、本周总结</h2>
{weekly_summary_html}
<h2>二、本周任务完成情况</h2>
{weekly_task_sections_html}
<h2>三、下周工作计划</h2>
<ol>
{weekly_next_plan_items_html}
</ol>
<div class="footer">由 DailyReport 周报生成 · {week_id}</div>
</article>
</body>
</html>
